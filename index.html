<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CREMA</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- ícones reutilizáveis (referenciados por <use>) -->
<svg class="svg-defs" aria-hidden="true">
  <defs>
    <g id="ic-cup"><path d="M4 8h11v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M15 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M3 21h14"/></g>
    <g id="ic-cup-steam"><path d="M4 8h11v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M15 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M3 21h14"/><path d="M7 5.5q1-1.2 2-.2t2-.2"/></g>
    <g id="ic-cup-off"><path d="M4 8h11v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M15 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M3 21h14"/><path d="M3 3 21 21"/></g>
    <g id="ic-drop"><path d="M10 2C10 2 4.5 8.5 4.5 11.5a5.5 5.5 0 0 0 11 0C15.5 8.5 10 2 10 2Z"/></g>
    <g id="ic-waves"><path d="M2.5 18.5q2-1.6 4 0t4 0t4 0t3 0"/></g>
    <g id="ic-flush"><path d="M4 7h12M10 2v5M6.5 7v2M13.5 7v2"/><path d="M6 12v3M10 12v5M14 12v3"/></g>
    <g id="ic-star-off"><path d="M10 2.5 12.3 7.2 17.5 8 13.7 11.6 14.6 16.8 10 14.3 5.4 16.8 6.3 11.6 2.5 8 7.7 7.2Z"/><path d="M3 3 17 17"/></g>
    <g id="ic-search"><circle cx="9" cy="9" r="6"/><path d="m13.5 13.5 4.5 4.5"/></g>
    <g id="ic-pencil"><path d="M13.5 2.5a2.1 2.1 0 0 1 3 3L7 15l-4 1 1-4 9.5-9.5Z"/></g>
    <g id="ic-moon"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7.5 7.5 0 1 0 9 9Z"/></g>
    <g id="ic-keyboard"><rect x="1.5" y="5" width="17" height="10" rx="2"/><path d="M4.5 8h1M7.5 8h1M10.5 8h1M13.5 8h1M4.5 11.5h11"/></g>
    <g id="ic-gear"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v2.2M10 16.3v2.2M18.5 10h-2.2M3.7 10H1.5M16 4l-1.6 1.6M5.6 14.4 4 16M16 16l-1.6-1.6M5.6 5.6 4 4"/></g>
  </defs>
</svg>

<div id="vp-probe" aria-hidden="true"></div>

<div class="app">

  <!-- ======================= HOME (01) / SHOT AO VIVO (02) ======================= -->
  <main class="home" id="home">


    <!-- ---------- coluna da receita (300px) ---------- -->
    <aside class="rail" id="rail">

      <div class="row rail__full">
        <span class="lb">Coffee</span>
        <span class="chip chip--sm" id="coffee-process">—</span>
      </div>

      <button class="rail__coffee tap" id="coffee-name-btn" type="button">
        <span class="rail__coffee-name" id="coffee-name">—</span>
        <span class="rail__coffee-brand" id="coffee-brand">—</span>
      </button>

      <button class="row rail__full rail__sep tap" id="grinder-btn" type="button">
        <span class="lb">Grinder</span>
        <span class="rail__grinder" id="grinder-name">—<span class="rail__caret">⌄</span></span>
      </button>

      <div class="rail__full rail__sep">
        <div class="row"><span class="lb">Grind</span></div>
        <button class="mono rail__grind tap" id="grind-value" type="button">—</button>
        <div class="ruler" id="grind-ruler" data-field="grind" style="width:300px"><b></b><i></i></div>
      </div>

      <div class="rail__ratio">
        <div class="lb lb--blue">Ratio</div>
        <div class="mono rail__ratio-value" id="ratio-value">1<span class="colon">:</span>0.0</div>
        <div class="rail__ratio-cols">
          <div class="rail__col">
            <div class="lb">Dose</div>
            <button class="mono rail__col-value tap" id="dose-value" type="button">—<span class="u">g</span></button>
            <div class="rail__col-chips" id="dose-chips"></div>
          </div>
          <div class="rail__col">
            <div class="lb">Drink</div>
            <button class="mono rail__col-value rail__col-value--amber tap" id="drink-value" type="button">—<span class="u">g</span></button>
            <div class="rail__col-chips" id="drink-chips"></div>
          </div>
        </div>
      </div>

      <div class="row rail__full rail__brew">
        <span class="lb">Brew</span>
        <button class="mono rail__brew-value tap" id="brew-value" type="button">—<span class="u">°C</span></button>
        <div class="rail__brew-chips" id="brew-chips">
          <button class="chip chip--round" data-temp="88" type="button">88</button>
          <button class="chip chip--round" data-temp="92" type="button">92</button>
          <button class="chip chip--round" data-temp="95" type="button">95</button>
        </div>
      </div>

      <button class="rail__machine tap" id="machine-group" type="button">
        <div class="rail__aux">
          <div class="rail__aux-item">
            <svg class="ic" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round">
              <use href="#ic-drop" stroke="var(--red)"/><use href="#ic-waves" stroke="var(--label)"/>
            </svg>
            <div class="lb lb--xs">Hot water</div>
            <div class="mono rail__aux-value" id="aux-water">—</div>
          </div>
          <div class="rail__aux-item">
            <div class="rail__aux-glyph">♨</div>
            <div class="lb lb--xs">Steam</div>
            <div class="mono rail__aux-value" id="aux-steam">—</div>
          </div>
          <div class="rail__aux-item">
            <svg class="ic" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 7h12M10 2v5M6.5 7v2M13.5 7v2" stroke="var(--text-2)"/>
              <path d="M6 12v3M10 12v5M14 12v3" stroke="var(--blue)"/>
            </svg>
            <div class="lb lb--xs">Flush</div>
            <div class="mono rail__aux-value" id="aux-flush">—</div>
          </div>
        </div>
        <div class="row rail__temps">
          <span class="lb lb--xs">Mix <span class="mono rail__temp" id="mix-value">—</span> °c</span>
          <span class="lb lb--xs">Group <span class="mono rail__temp" id="group-value">—</span> °c</span>
        </div>
      </button>

    </aside>

    <!-- ---------- conteúdo ---------- -->
    <section class="content">

      <div class="row topbar" id="topbar">
        <button class="topbar__favs tap" id="edit-favorites" type="button">
          <svg class="ic" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-pencil"/></svg>
          profiles
        </button>
        <div class="topbar__right">
          <div class="state-pill state-pill--disconnected" id="state-pill">
            <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="state-icon"><use href="#ic-cup-off"/></svg>
            <span id="state-label">Disconnected</span>
          </div>
          <button class="pill tap" id="btn-sleep" type="button">
            <svg class="ic ic--blue" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-moon"/></svg>
            SLEEP
          </button>
          <button class="pill tap" id="btn-settings" type="button">
            <svg class="ic ic--blue" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-gear"/></svg>
            SETTINGS
          </button>
        </div>
      </div>

      <div class="carousel" id="carousel"></div>

      <div class="card chart-card" id="chart-card">
        <div class="row chart-card__head">
          <div></div>
          <div class="chart-card__tools">
            <div class="legend" id="chart-legend">
              <span><i style="background:var(--blue)"></i>Flow</span>
              <span><i style="background:var(--green)"></i>Pressure</span>
              <span><i style="background:var(--red)"></i>Temp</span>
            </div>
            <span class="toggle-label">Static</span>
            <button class="toggle is-on" id="static-toggle" type="button" role="switch" aria-checked="true"><i></i></button>
          </div>
        </div>
        <div class="chart-card__plot" id="chart-host"></div>
      </div>

      <div class="home__bottom" id="home-bottom">
        <div class="card lastshot" id="lastshot">
          <button class="stepper tap" id="shot-prev" type="button">‹</button>
          <button class="lastshot__body tap" id="lastshot-body" type="button">
            <div class="lastshot__title">
              <span id="lastshot-profile">—</span>
              <span class="lastshot__coffee" id="lastshot-coffee"></span>
            </div>
            <div class="mono lastshot__meta" id="lastshot-meta">—</div>
          </button>
          <svg class="lastshot__mini" id="lastshot-mini" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
          <button class="stepper tap" id="shot-next" type="button">›</button>
        </div>
        <div class="card scale-card">
          <div class="row">
            <span class="lb">Scale · Weight</span>
            <span class="mono scale-card__value" id="scale-weight">0.0<span class="u"> g</span></span>
          </div>
          <div class="row">
            <span class="scale-card__status" id="scale-status">Disconnected</span>
            <button class="pill pill--sm pill--blue tap" id="scale-connect" type="button">CONNECT</button>
          </div>
        </div>
      </div>

    </section>

    <!-- ---------- tanque ---------- -->
    <div class="tank" id="tank">
      <div class="lb lb--xs">Tank</div>
      <div class="tank__track">
        <div class="tank__tube"><div class="tank__fill" id="tank-fill"></div></div>
        <div class="mono tank__pct" id="tank-pct">—</div>
      </div>
      <div class="mono tank__ml" id="tank-ml">—<span class="u"> ml</span></div>
    </div>

  </main>

  <!-- máquina dormindo: a skin fica apagada e qualquer toque acorda -->
  <button class="sleep-veil" id="sleep-veil" type="button" hidden>
    <svg class="ic sleep-veil__icon" width="64" height="64" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-moon"/></svg>
    <span class="sleep-veil__title">Sleeping</span>
    <span class="sleep-veil__hint">Tap to wake</span>
  </button>

  <!-- ======================= 02 · SHOT AO VIVO ======================= -->
  <section class="live" id="live" hidden>

    <header class="row live__head">
      <div class="live__recipe">
        <div class="live__field"><div class="lb">Profile</div><div class="live__v" id="lv-profile">—</div></div>
        <div class="live__sep"></div>
        <div class="live__field"><div class="lb">Coffee</div><div class="live__v" id="lv-coffee">—</div></div>
        <div class="live__sep"></div>
        <div class="live__field"><div class="lb">Grinder</div><div class="live__v" id="lv-grinder">—</div></div>
        <div class="live__sep"></div>
        <div class="live__field"><div class="lb">Dose → Drink</div><div class="mo live__v live__v--mono" id="lv-dose">—</div></div>
        <div class="live__field"><div class="lb lb--blue">Ratio</div><div class="mo live__v live__v--mono live__v--blue" id="lv-ratio">—</div></div>
        <div class="live__field"><div class="lb">Brew</div><div class="mo live__v live__v--mono live__v--red" id="lv-brew">—</div></div>
      </div>
      <div class="live__right">
        <div class="mo live__timer"><span id="lv-timer">0.0</span><span class="u">s</span></div>
        <button class="btn-stop" id="btn-stop" type="button" data-mode="stop"><span class="btn-stop__sq"></span><span id="btn-stop-label">STOP</span></button>
      </div>
    </header>

    <div class="row live__legend">
      <span class="lb lb--xs">bar / ml·s</span>
      <div class="live__legend-items">
        <span><i style="background:var(--blue)"></i>Flow <i class="dash" style="border-color:var(--blue)"></i></span>
        <span><i style="background:var(--green)"></i>Pressure <i class="dash" style="border-color:var(--green)"></i></span>
        <span><i style="background:var(--red)"></i>Temperature</span>
        <span><i style="background:var(--amber)"></i>Weight</span>
      </div>
    </div>

    <div class="live__plot" id="live-chart"></div>

    <div class="live__phases" id="live-phases"></div>

  </section>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
